[project]
name = "antsarray"
version = "0.1.0"
description = "AntsArray analysis and tracking pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "matplotlib",
    "scipy",
    "shapely>=2,<3",
    "scikit-learn",
    "joblib",
    "umap-learn",
    "igraph",
    "leidenalg",
    "statsmodels",
    "tqdm",
    "h5py",
    "tables",
    "opencv-python",
    "pillow",
    "torch",
    "torchvision",
    "segmentation-models-pytorch",
    "sleap-io",
]

[project.optional-dependencies]
interactive = ["plotly>=5,<7"]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["analysis", "tracking", "camera_cal", "scripts", "detection_pipeline", "group_labelling"]
# Exploratory *_test.py scripts execute real datasets when imported.
python_files = ["test_*.py"]
